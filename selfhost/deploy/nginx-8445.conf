# ds-harness-remote 自托管 Server —— 监听 8445，反代到 127.0.0.1:18080
# 与 8444 的 DSH Web GUI 完全独立，互不影响。
# 复用现有 ZeroSSL 证书（证书 SAN 含 IP:106.52.246.121）。
# $connection_upgrade 由 sites-enabled/dsh-proxy 全局定义。

server {
    listen 8445 ssl http2;
    server_name 106.52.246.121;

    client_max_body_size 64m;

    ssl_certificate     /etc/nginx/ssl/zerossl-fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/zerossl.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
